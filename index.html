<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>玉勅代天府德慈宮｜3D Q版線上參拜</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 非阻塞載入精簡版明體字型（避免下載整包數 MB 繁體字型拖慢開啟速度！） -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" crossorigin />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"PingFang TC"', '"Noto Sans TC"', '"Microsoft JhengHei"', 'sans-serif'],
            serif: ['"Noto Serif TC"', '"DFKai-SB"', 'serif']
          }
        }
      }
    };
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --paper: #fbf7e9;
      --ink: #183c32;
      --dark-pill: rgba(21, 53, 45, 0.90);
      --accent: #e5b968;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #132738;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #scene-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.28s ease-out;
    }
    @keyframes bounceOnce {
      0% { transform: translateY(-28px) scale(0.85); opacity: 0.4; }
      55% { transform: translateY(5px) scale(1.05); opacity: 1; }
      80% { transform: translateY(-4px) scale(0.98); }
      100% { transform: translateY(0) scale(1); }
    }
    .animate-bounce-once {
      animation: bounceOnce 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float-soft {
      animation: floatSoft 2.8s ease-in-out infinite;
    }
    @keyframes loaderShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    /* 零依賴原生載入畫面（開啟網頁第一毫秒即顯示，避免等待 CDN 白屏！） */
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: radial-gradient(circle at 50% 35%, #215244 0%, #14332B 58%, #0B1F1A 100%);
      color: #FFFBF0;
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #app-loader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-card {
      width: 100%;
      max-width: 468px;
      padding: 26px 20px 24px;
      box-sizing: border-box;
      border-radius: 24px;
      background: rgba(15, 39, 32, 0.94);
      border: 2px solid #E5B968;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 4px rgba(229, 185, 104, 0.16);
      text-align: center;
    }
    .loader-emblem {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(145deg, #B91C1C, #7C1210);
      border: 2.5px solid #FAD364;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 8px 24px rgba(185, 28, 28, 0.45);
    }
    .loader-sub {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: #F5D68E;
      margin-bottom: 6px;
    }
    .loader-title {
      font-family: "Noto Serif TC", "DFKai-SB", serif;
      font-size: clamp(18px, 4.7vw, 26px);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #FFF8DF;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      line-height: 1.3;
      margin: 0 0 18px;
      white-space: nowrap;
    }
    .loader-wait {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #FFE49E;
      margin: -6px 0 16px;
    }
    .loader-track {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 251, 240, 0.14);
      border: 1.5px solid rgba(229, 185, 104, 0.65);
      overflow: hidden;
      padding: 2px;
      box-sizing: border-box;
    }
    .loader-fill {
      height: 100%;
      width: 8%;
      border-radius: 999px;
      background: linear-gradient(90deg, #D97706, #FAD364, #E11D48, #FAD364);
      background-size: 200% 100%;
      animation: loaderShimmer 1.8s linear infinite;
      transition: width 0.28s ease-out;
    }
    .loader-meta {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #F5E6C8;
    }
    .loader-pct {
      color: #FAD364;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(160, 118, 62, 0.45); border-radius: 999px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="font-sans text-[#183C32]">
  <!-- ★ 專屬宮廟遊戲載入畫面（開啟頁面即刻顯示進度條，標題：玉勅代天府德慈宮） -->
  <div id="app-loader" role="status" aria-live="polite">
    <div class="loader-card">
      <div class="loader-emblem animate-float-soft">🏮</div>
      <div class="loader-sub">代天巡狩・五年千歲・3D 線上參拜</div>
      <h1 class="loader-title">玉勅代天府德慈宮</h1>
      <div class="loader-wait">遊戲載入中... 請耐心等候...</div>
      <div class="loader-track">
        <div id="loader-bar" class="loader-fill"></div>
      </div>
      <div class="loader-meta">
        <span id="loader-stage">正在載入 3D 廟宇引擎…</span>
        <span id="loader-pct" class="loader-pct">8%</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      let currentPct = 8;
      let realProgressStarted = false;
      const bar = document.getElementById('loader-bar');
      const pctEl = document.getElementById('loader-pct');
      const stageEl = document.getElementById('loader-stage');
      const loaderEl = document.getElementById('app-loader');
      let trickleTimer = setInterval(function () {
        if (!realProgressStarted && currentPct < 36) {
          currentPct += 2;
          if (bar) bar.style.width = currentPct + '%';
          if (pctEl) pctEl.textContent = currentPct + '%';
        }
      }, 240);

      window.__setTempleLoader = function (pct, msg) {
        realProgressStarted = true;
        if (trickleTimer) {
          clearInterval(trickleTimer);
          trickleTimer = null;
        }
        currentPct = Math.max(currentPct, Math.min(100, Math.round(pct)));
        if (bar) bar.style.width = currentPct + '%';
        if (pctEl) pctEl.textContent = currentPct + '%';
        if (msg && stageEl) stageEl.textContent = msg;
      };

      window.__finishTempleLoader = function () {
        realProgressStarted = true;
        if (trickleTimer) {
          clearInterval(trickleTimer);
          trickleTimer = null;
        }
        window.__setTempleLoader(100, '恭迎蒞臨・準備完成！');
        setTimeout(function () {
          if (loaderEl) loaderEl.classList.add('is-done');
          setTimeout(function () { if (loaderEl) loaderEl.remove(); }, 480);
        }, 220);
      };

      window.__showTempleLoaderError = function (title, detail, rawErr) {
        realProgressStarted = true;
        if (trickleTimer) {
          clearInterval(trickleTimer);
          trickleTimer = null;
        }
        var host = document.getElementById('app-loader');
        if (!host) {
          host = document.createElement('div');
          host.id = 'app-loader';
          document.body.appendChild(host);
        }
        host.classList.remove('is-done');
        var safeTitle = String(title || '3D 廟宇場景載入暫時受阻');
        var safeDetail = String(detail || '請重新整理頁面，或關閉分頁後重新開啟瀏覽器再試一次。');
        var safeRaw = rawErr ? String(rawErr) : '';
        host.innerHTML =
          '<div class="loader-card">' +
            '<div class="loader-emblem">🙏</div>' +
            '<div class="loader-sub">玉勅代天府德慈宮</div>' +
            '<h2 style="font-size:20px;font-weight:900;color:#FFE49E;margin:4px 0 12px;">' + safeTitle + '</h2>' +
            '<p style="font-size:13px;line-height:1.65;color:#F5E6C8;margin:0 0 16px;text-align:left;">' + safeDetail + '</p>' +
            (safeRaw ? '<div style="font-size:11px;font-family:monospace;color:#FCA5A5;background:rgba(0,0,0,0.35);padding:8px 10px;border-radius:10px;margin-bottom:16px;word-break:break-all;text-align:left;">' + safeRaw + '</div>' : '') +
            '<button onclick="location.reload()" style="width:100%;padding:12px 18px;border-radius:14px;border:2px solid #FAD364;background:linear-gradient(135deg,#B91C1C,#8E1515);color:#FFFBF0;font-size:14px;font-weight:900;cursor:pointer;">🔄 重新載入德慈宮</button>' +
          '</div>';
      };
    })();
  </script>

  <!-- 3D 廟宇場景全螢幕畫布 -->
  <div id="scene-container" class="fixed inset-0 w-full h-full"></div>

  <!-- 頂部文創標題列（★ 手機／桌機響應式 UX 排版全面優化：單排對齊不折行、不遮畫面！） -->
  <header class="fixed top-0 left-0 right-0 z-30 pointer-events-none px-2.5 sm:px-5 py-2 flex flex-col gap-1.5">
    <div class="w-full flex items-center justify-between gap-2">
      <!-- 左上：宮廟標誌（手機精巧單行、桌機完整全名＋在線膠囊） -->
      <div class="pointer-events-auto flex items-center gap-2.5 px-2.5 sm:px-3.5 py-1.5 rounded-xl bg-[#FFFBF2] border-2 border-[#C98A28] shadow-[0_6px_18px_rgba(16,32,26,0.22)] text-[#1C2D28] min-w-0">
        <div class="min-w-0">
          <div class="text-[10px] font-extrabold tracking-[0.08em] text-[#8E1515] leading-none whitespace-nowrap">
            <span class="sm:hidden">安定區港口里</span>
            <span class="hidden sm:inline">安定區港口里・代天巡狩五年千歲</span>
          </div>
          <div class="font-serif font-black text-[13px] sm:text-lg tracking-[0.04em] sm:tracking-[0.12em] mt-0.5 leading-tight text-[#183C32] whitespace-nowrap">
            玉勅代天府德慈宮
          </div>
        </div>
        <span id="online-status-pill" class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#E6F4EC] border border-[#2F855A]/40 text-xs font-extrabold text-[#14532D] shrink-0">
          <span class="w-2 h-2 rounded-full bg-[#16A34A] animate-pulse"></span>
          <span id="online-count-text">多人連線：1 位真人</span>
        </span>
      </div>

      <!-- 右上：功德背包 ＋ 晝夜切換 ＋ 配樂（永遠單排不折行！） -->
      <div class="pointer-events-auto flex items-center justify-end gap-1 sm:gap-1.5 shrink-0">
        <button id="btn-open-backpack"
          class="px-2 sm:px-3 h-9 sm:h-10 rounded-xl bg-[#FFFBF2] hover:bg-[#FEF3C7] border-2 border-[#C98A28] text-[#1C2D28] text-xs font-extrabold shadow-[0_6px_16px_rgba(16,32,26,0.2)] transition flex items-center gap-1 whitespace-nowrap"
          title="查看隨身香火背包與每日簽到（自動存檔中）">
          <span>✨</span>
          <span id="hud-merit-text" class="text-[#8E1515] font-black">30 功德</span>
          <span class="text-[#C9B082]">|</span>
          <span>🎒<span id="hud-bag-count" class="font-black text-[#183C32] ml-0.5">2</span></span>
        </button>

        <button id="btn-toggle-daynight"
          class="px-2 sm:px-3 h-9 sm:h-10 rounded-xl bg-[#FFFBF2] hover:bg-[#FEF3C7] border-2 border-[#C98A28] text-[#183C32] text-xs font-extrabold shadow-[0_6px_16px_rgba(16,32,26,0.2)] transition flex items-center gap-1 whitespace-nowrap"
          title="切換日景／夜景">
          <span id="daynight-icon">🌙</span>
          <span id="daynight-label" class="hidden sm:inline">切換夜景</span>
        </button>

        <div class="flex items-center gap-1.5 px-2 sm:px-2.5 h-9 sm:h-10 rounded-xl bg-[#FFFBF2] border-2 border-[#C98A28] shadow-[0_6px_16px_rgba(16,32,26,0.2)] text-[#183C32]">
          <button id="btn-toggle-audio" class="text-xs font-extrabold text-[#8E1515] hover:text-[#183C32] transition whitespace-nowrap">🔊</button>
          <input id="audio-volume" type="range" min="0" max="100" value="55" title="調整音量"
            class="hidden sm:block w-16 accent-[#8E1515] cursor-pointer" />
        </div>
      </div>
    </div>

    <!-- 第二行左側：參拜進度引導卡（手機預設精巧收合，展開時寬度充裕不擠字！） -->
    <div id="worship-guide-host" class="pointer-events-auto self-start"></div>
  </header>

  <!-- 中央上方溫馨 Toast 提示容器 -->
  <div id="toast-host" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-[92vw] max-w-lg text-center"></div>

  <!-- 底部視角切換列（★ 已取消虛擬搖桿，僅保留視角切換、拉近拉遠、走出廟外與廟務後台！） -->
  <div class="fixed bottom-[60px] sm:bottom-3 left-2.5 right-2.5 sm:left-auto sm:right-3 z-30 flex items-center justify-between sm:justify-end gap-1.5 pointer-events-none">
    <div class="pointer-events-auto flex items-center gap-0.5 p-1 rounded-xl bg-[#FFFBF2] border-2 border-[#C98A28] shadow-[0_6px_18px_rgba(16,32,26,0.24)] text-[#183C32]">
      <button data-cam-preset="front" title="正面視角" class="cam-preset-btn px-2 sm:px-2.5 h-8 rounded-lg bg-[#8E1515] text-[#FFFDF6] text-xs font-black transition shadow-sm whitespace-nowrap">正面</button>
      <button data-cam-preset="left" title="左側視角" class="cam-preset-btn px-2 sm:px-2.5 h-8 rounded-lg hover:bg-[#F3E6CA] text-[#183C32] text-xs font-extrabold transition whitespace-nowrap">左側</button>
      <button data-cam-preset="right" title="右側視角" class="cam-preset-btn px-2 sm:px-2.5 h-8 rounded-lg hover:bg-[#F3E6CA] text-[#183C32] text-xs font-extrabold transition whitespace-nowrap">右側</button>
      <button data-cam-preset="god" title="上帝俯瞰視角" class="cam-preset-btn px-2 sm:px-2.5 h-8 rounded-lg hover:bg-[#F3E6CA] text-[#8E1515] text-xs font-black transition whitespace-nowrap">👁️上帝</button>
      <span class="w-px h-5 bg-[#D4BC90] mx-0.5"></span>
      <button id="cam-zoom-in" title="拉近視角" class="w-7 h-8 rounded-lg hover:bg-[#F3E6CA] text-base font-black text-[#183C32] transition">＋</button>
      <button id="cam-zoom-out" title="拉遠視角" class="w-7 h-8 rounded-lg hover:bg-[#F3E6CA] text-base font-black text-[#183C32] transition">－</button>
    </div>
    <button id="btn-admin-entry" title="廟務管理後臺"
      class="pointer-events-auto px-2.5 sm:px-3 h-10 rounded-xl bg-[#FFFBF2] hover:bg-[#8E1515] text-[#8E1515] hover:text-[#FFFDF6] text-xs font-black border-2 border-[#C98A28] shadow-[0_6px_18px_rgba(16,32,26,0.24)] transition whitespace-nowrap shrink-0">
      🏛️ 廟務
    </button>
  </div>

  <!-- 進入大殿屋內時專屬「走出廟外」浮動快捷鈕（獨立置於左下角不與聊天框或視角列重疊！） -->
  <button id="btn-exit-hall" title="走出大殿回到廟埕"
    class="hidden fixed left-3 bottom-[112px] sm:left-4 sm:bottom-4 z-30 px-3.5 h-10 rounded-xl bg-[#183C32] hover:bg-[#235245] text-[#FFFBF2] border-2 border-[#E5B968] shadow-[0_6px_18px_rgba(10,24,20,0.38)] text-xs sm:text-sm font-black transition whitespace-nowrap">
    🚪 走出廟外
  </button>

  <!-- 右側互動提示鈕掛載點（已取消虛擬搖桿） -->
  <div id="joystick-root"></div>
  <div id="proximity-action-root"></div>

  <!-- 玩家登入後底部即時聊天對話框、RPG 劇情浮現框、板凳聊天室、念經字幕與互動彈窗掛載點 -->
  <div id="world-chat-root"></div>
  <div id="rpg-narrator-root"></div>
  <div id="bench-chat-root"></div>
  <div id="chant-root"></div>
  <div id="modal-root"></div>
  <div id="welcome-root"></div>

  <script type="module" src="./src/main.js?v=20261124v19"></script>
</body>
</html>
